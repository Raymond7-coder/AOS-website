<!-- @format -->
<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>AOS Orwell</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
			rel="stylesheet"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
		/>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
		/>
		<link rel="stylesheet" href="output.css" />
	</head>
	<body class="!bg-white">
	   <div id="navbar-placeholder"></div>
	   <div style="height: 120px; width: 100%;"></div>

  <!-- HERO -->
 <section 
    style="
    background-color: #019B39; 
    color: white; 
    padding: 80px 80px; 
    min-height: 260px;
    display: flex;
    align-items: center;
  "
 >
  <div style="max-width: 900px;">
    <h1 
      style="
        color: white; 
        font-size: 56px; 
        line-height: 1.1; 
        font-weight: 700; 
        margin: 0 0 16px 0;
      "
    >
      How Can We Help You?
    </h1>

    <p 
      style="
        color: rgba(255,255,255,0.9); 
        font-size: 20px; 
        line-height: 1.6; 
        margin: 0;
      "
    >
      Send us your enquiry and the right team will get back to you.
    </p>
  </div>
 </section>

  <!-- FORM SECTION -->
  <section class="px-4 md:px-20 py-16">
    <div class="form-card max-w-4xl mx-auto bg-white p-8 md:p-12 rounded-md shadow-sm">

      <h2 class="text-3xl md:text-4xl font-bold text-black mb-3">
        We would love to hear from you
      </h2>

      <p class="text-gray-700 mb-8">
        You can reach us anytime via 
        <a href="mailto:sales@aosorwell.com" class="text-[#019B39] font-semibold">
          sales@aosorwell.com
        </a>
      </p>

      <form id="requestForm" class="space-y-6">

        <div>
          <label class="block text-sm font-semibold text-gray-900 mb-2">Name</label>
          <input 
            type="text"
            name="name"
            required
            placeholder="Your Name"
            class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:border-[#019B39]"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-900 mb-2">Email</label>
          <input 
            type="email"
            name="email"
            required
            placeholder="you@example.com"
            class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:border-[#019B39]"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-900 mb-2">Phone Number</label>
          <input 
            type="tel"
            name="phone"
            placeholder="+234..."
            class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:border-[#019B39]"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-900 mb-2">I am contacting as</label>
          <select 
            name="contacting_as"
            required
            class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:border-[#019B39]"
          >
            <option value="">Select one</option>
            <option>Individual</option>
            <option>Company Representative</option>
            <option>Vendor / Supplier</option>
            <option>Job Applicant</option>
            <option>Partner</option>
            <option>Other</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-900 mb-2">
            Company / Organization Name
            <span class="text-gray-500 font-normal">(Optional)</span>
          </label>
          <input 
            type="text"
            name="organization"
            placeholder="Company, organization, or leave blank"
            class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:border-[#019B39]"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-900 mb-2">Enquiry Type</label>
          <select 
            name="enquiry_type"
            required
            class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:border-[#019B39]"
          >
            <option value="">Select enquiry type</option>
            <option>Request for Quote</option>
            <option>General Enquiry</option>
            <option>Technical Support</option>
            <option>Partnership</option>
            <option>Vendor / Supplier Enquiry</option>
            <option>Careers</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-900 mb-2">
            Service Area
            <span class="text-gray-500 font-normal">(Optional)</span>
          </label>
          <select 
            name="service_area"
            class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:border-[#019B39]"
          >
            <option value="">Select service area</option>
            <option>Well Construction</option>
            <option>Integrated Project Management</option>
            <option>Process Management</option>
            <option>Operations & Maintenance</option>
            <option>Other</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-900 mb-2">How can we help?</label>
          <textarea 
            name="message"
            rows="5"
            required
            placeholder="Tell us a little about how we can help"
            class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:border-[#019B39]"
          ></textarea>
        </div>

        <button 
          type="submit"
          class="w-full bg-[#019B39] text-white font-semibold py-3 rounded-md hover:bg-[#016125] transition"
        >
          Submit Request
        </button>

        <p id="formMessage" class="hidden text-[#019B39] font-semibold text-center">
          Thank you. Your request has been received.
        </p>

      </form>

    </div>
  </section>

  <script>
    const form = document.getElementById("requestForm");
    const formMessage = document.getElementById("formMessage");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      formMessage.classList.remove("hidden");
      form.reset();
    });
  </script>
  <script>
  fetch("./navbar.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("navbar-placeholder").innerHTML = data;
    })
    .catch(error => {
      console.error("Navbar could not load:", error);
    });
</script>
<script src="./navbar.js"></script>
</body>
</html>
